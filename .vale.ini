StylesPath = .github/styles

# Packages to download via `vale sync`. `BasedOnStyles` below references
# them by name, but Vale does not auto-resolve styles without this list.
Packages = Microsoft

MinAlertLevel = error

[docs/**]
BasedOnStyles = Microsoft
# Microsoft.Quotes is wrong for inline quoted terms mid-sentence (e.g.
# `"canary"` between prose). It demands punctuation inside the quotes,
# which produces unnatural constructions like `"canary".`. Disabled.
Microsoft.Quotes = NO
