version: 2
updates:
  # The glob covers the root plus every pnpm workspace (packages/*, apps/*).
  # A bare "/" would only see root devDependencies.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/*"
      - "/apps/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Stop Dependabot from generating five PRs when five packages share the same
    # dep bump. Group so each ecosystem is bumped once.
    groups:
      npm-prod:
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-dev:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["major"]
    # `increase` bumps the manifest specifier (^X.Y.Z -> ^X+1.0.0) so the
    # workspace package.json stays consistent with the regenerated lockfile.
    # Without this, Dependabot updates the lockfile but leaves the specifier
    # unchanged and `pnpm install --frozen-lockfile` fails in CI.
    versioning-strategy: increase

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: "scope"