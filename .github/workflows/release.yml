name: Release

on:
  push:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  publish-canary:
    name: Publish canary
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          # Node 24.x (no edge channel; 'edge' isn't a valid value).
          # Rolling 24.x patches. Required because Trusted Publishing needs
          # npm >= 11.5.1, and the latest npm requires Node >= 22.22.
          node-version: '24.x'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deessejs/example build
      - run: pnpm --filter @deessejs/example test:run

      - name: Snapshot-version packages
        run: pnpm changeset version --snapshot canary

      - name: Publish to @canary
        run: pnpm changeset publish --tag canary --no-git-tag
        env:
          NPM_CONFIG_PROVENANCE: 'true'

  publish-stable:
    name: Publish stable
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm Trusted Publishing (OIDC)
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          # Node 24.x (no edge channel; 'edge' isn't a valid value).
          # Rolling 24.x patches. Required because Trusted Publishing needs
          # npm >= 11.5.1, and the latest npm requires Node >= 22.22.
          node-version: '24.x'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - run: pnpm turbo test:run

      - name: Create release PR or publish to npm
        uses: changesets/action@v2
        with:
          version: pnpm version
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
