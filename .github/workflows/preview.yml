name: Preview (pkg.pr.new)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [dev]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Publish preview tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deessejs/example build
      - run: pnpm --filter @deessejs/package-cli build

      - name: Publish previews to pkg.pr.new
        run: pnpm exec pkg-pr-new publish --bin '@deessejs/package-cli' './packages/example' './apps/cli'